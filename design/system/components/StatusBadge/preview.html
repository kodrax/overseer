<!-- @dsCard group="Status" height=96 subtitle="Progress dot + the status word" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusBadge — preview</title></head>
<body>
<div class="ov-stack" style="gap:6px"><div style="display:flex;gap:16px;flex-wrap:wrap"><span class="ov-status" data-p="0"><span class="ov-dot" aria-hidden="true"></span>backlog</span><span class="ov-status" data-p="25"><span class="ov-dot" aria-hidden="true"></span>ready</span><span class="ov-status" data-p="50"><span class="ov-dot" aria-hidden="true"></span>in_progress</span><span class="ov-status" data-p="75"><span class="ov-dot" aria-hidden="true"></span>review</span><span class="ov-status" data-p="100"><span class="ov-dot" aria-hidden="true"></span>done</span><span class="ov-status" data-p="closed"><span class="ov-dot" aria-hidden="true"></span>cancelled</span></div><div style="display:flex;gap:16px;flex-wrap:wrap"><span class="ov-status" data-p="0"><span class="ov-dot" aria-hidden="true"></span>proposed</span><span class="ov-status" data-p="25"><span class="ov-dot" aria-hidden="true"></span>approved</span><span class="ov-status" data-p="75"><span class="ov-dot" aria-hidden="true"></span>implemented</span><span class="ov-status" data-p="100"><span class="ov-dot" aria-hidden="true"></span>verified</span><span class="ov-status" data-p="closed"><span class="ov-dot" aria-hidden="true"></span>deferred</span><span class="ov-status" data-p="closed"><span class="ov-dot" aria-hidden="true"></span>rejected</span><span class="ov-status" data-p="closed"><span class="ov-dot" aria-hidden="true"></span>obsolete</span></div></div>
</body>
</html>
